              <input type="text" id="search-input" placeholder="Ketik judul buku...">
          </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead style="background-color: #403d88">
              <tr>
                <th rowspan="2">No. Anggota</th>
                <th rowspan="2">Nama</th>
                <th rowspan="2">Alamat</th>
                <th rowspan="2">No. Hp</th>
                <th colspan="2">Jenis Kelamin</th>
                <th colspan="3">Aksi</th>
              </tr>

              <tr>
                <th>Perempuan</th>
                <th>Laki-laki</th>
                <th>Edit</th>
                <th>Delete</th>
                <th>Detail</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>A001</td>
                <td>Siti Aminah</td>

                <td>v</td>
                <td></td>
                <td>
                  <button class="button-edit" type="button">Edit</button>
                </td>
                <td>
                  <button class="button-delete" type="button">Hapus</button>
                </td>
                <td>
                  <button class="button-detail" type="button">Detail</button>
                </td>

              <tr>

                </td>
                <td>
                  <button class="button-detail" type="button">Detail</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
