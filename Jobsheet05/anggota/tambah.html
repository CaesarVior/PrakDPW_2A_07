<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS Mini | Tambah Anggota</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: #403d88"
    >
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="list.html">Daftar Anggota</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tambah.html">Tambah Anggota</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section>
        <h2>Tambah Anggota</h2>
        <form id="form-tambah">
          <div class="mb-3">
            <label for="nama" class="form-label fw-semibold">Nama</label>
            <input
              type="text"
              class="form-control"
              id="nama"
              name="nama"
              placeholder="Masukkan Nama Anda"
              required
            />
          </div>
          <div class="mb-3">
            <label for="no_anggota" class="form-label fw-semibold"
              >No. Anggota</label
            >
            <input
              type="text"
              class="form-control"
              id="no_anggota"
              name="no_anggota"
              placeholder="Masukkan No. Anggota"
              required
            />
          </div>
          <div class="mb-3">
            <label for="alamat" class="form-label fw-semibold">Alamat</label>
            <input
              type="text"
              class="form-control"
              id="alamat"
              name="alamat"
              placeholder="Masukkan Alamat Anda"
            />
          </div>
          <div class="mb-3">
            <label for="no_hp" class="form-label fw-semibold">No. HP</label>
            <input
              type="text"
              class="form-control"
              id="no_hp"
              name="no_hp"
              placeholder="Masukkan No. Hp Anda"
            />
          </div>
          <button
            type="submit"
            class="btn"
            style="background-color: #403d88; color: #fff"
          >
            Simpan
          </button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 SIMPUS MINI &mdash; Jobsheet 5.</p>
    </footer>
    <script src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
