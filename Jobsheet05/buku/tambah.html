<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS Mini | Tambah Buku</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: #403d88"
    >
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
        <button
          type="button"
          id="nav-toggle-btn"
          class="nav-toggle-label"
          aria-label="Menu"
        >
          &#9776;
        </button>
        <nav id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tambah.html">Tambah Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section>
        <h2>Tambah Buku</h2>
        <form id="form-tambah">
          <div class="mb-3">
            <label for="judul" class="form-label fw-semibold">Judul</label>
            <input
              type="text"
              class="form-control"
              id="judul"
              name="judul"
              placeholder="Masukkan Judul Buku"
            />
          </div>
          <div class="mb-3">
            <label for="pengarang" class="form-label fw-semibold"
              >Pengarang</label
            >
            <input
              type="text"
              class="form-control"
              id="pengarang"
              placeholder="Masukkan Nama Pengarang"
              name="pengarang"
            />
          </div>
          <div class="mb-3">
            <label for="tahun" class="form-label fw-semibold"
              >Tahun Terbit</label
            >
            <input
              type="number"
              class="form-control"
              id="tahun"
              name="tahun"
              placeholder="Masukkan Tahun Terbit"
            />
          </div>
          <div class="mb-3">
            <label for="isbn" class="form-label fw-semibold">ISBN</label>
            <input
              type="text"
              class="form-control"
              id="isbn"
              name="isbn"
              placeholder="Masukkan ISBN"
            />
          </div>
          <div class="mb-3">
            <label for="stok" class="form-label fw-semibold">Stok</label>
            <input
              type="number"
              class="form-control"
              id="stok"
              name="stok"
              placeholder="Masukkan Stok "
            />
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label fw-semibold"
              >Kategori</label
            >
            <select class="form-select" id="kategori" name="kategori">
              <option value="fiksi">Fiksi</option>
              <option value="non-fiksi">Non-Fiksi</option>
              <option value="referensi">Referensi</option>
            </select>
          </div>
          <button
            type="submit"
            class="btn"
            style="background-color: #403d88; color: #fff"
          >
            Simpan
          </button>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2024 SIMPUS MINI &mdash; Jobsheet 5.</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
